{% set name = "perl-common-sense" %}
{% set version = "3.75" %}
{% set sha256 = "a86a1c4ca4f3006d7479064425a09fa5b6689e57261fcb994fe67d061cba0e7e" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  url: https://cpan.metacpan.org/authors/id/M/ML/MLEHMANN/common-sense-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  # the module explicitly installs itself to arch (subversion-specific) path
  #and thus cannot be noarch despite being pure-Perl
  #noarch: generic
  number: 1
  script:
    - perl Makefile.PL INSTALLDIRS=vendor NO_PERLLOCAL=1 NO_PACKLIST=1
    - make
    - make test
    - make install VERBINST=1

requirements:
  build:
    - make
  host:
    - perl
    - perl-extutils-makemaker
  run:
    - perl

test:
  imports:
    - common::sense

about:
  home: https://metacpan.org/dist/common-sense
  license: GPL-1.0-or-later OR Artistic-1.0-Perl
  license_family: OTHER
  summary: 'Sane defaults for Perl programs'
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cbrueffer
